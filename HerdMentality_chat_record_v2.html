<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HerdMentality — Recovered Chat Log</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f3f5;
  --panel:#f7f7f8;
  --ink:#252933;
  --muted:#7d8290;
  --line:#cbd0da;
  --accent:#8f91aa;
  --accent-soft:#e9e9f0;
  --mono:Menlo,Monaco,Consolas,"Liberation Mono","Yu Gothic","Hiragino Kaku Gothic ProN",monospace;
  --serif:Georgia,"Times New Roman","Yu Mincho","Hiragino Mincho ProN",serif;
}
html,body{min-height:100%}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.wrap{
  width:min(780px,96vw);
  border:1px solid var(--line);
  background:rgba(247,247,248,.72);
  box-shadow:0 18px 55px rgba(40,45,55,.08);
}
.topbar{
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  font:8px var(--mono);
  letter-spacing:.12em;
  color:var(--muted);
}
.status{color:var(--accent)}
.chat{
  height:min(650px,72vh);
  overflow-y:auto;
  padding:24px 22px 28px;
  scroll-behavior:smooth;
}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--accent)}
.day{
  text-align:center;
  margin:8px 0 24px;
  font:7px var(--mono);
  letter-spacing:.12em;
  color:var(--muted);
}
.msg{
  display:flex;
  gap:10px;
  align-items:flex-end;
  margin:0 0 16px;
  opacity:0;
  transform:translateY(12px);
  animation:pop .36s ease forwards;
}
.msg.self{justify-content:flex-end}
.meta{
  width:96px;
  flex:0 0 96px;
  padding-bottom:5px;
  font:7px/1.45 var(--mono);
  color:var(--muted);
}
.self .meta{text-align:right;order:2}
.bubble{
  max-width:min(470px,72%);
  border:1px solid var(--line);
  background:#fff;
  padding:11px 13px 12px;
  font-size:13px;
  line-height:1.75;
  letter-spacing:.01em;
}
.self .bubble{
  background:var(--accent-soft);
}
.name{
  display:block;
  margin-bottom:4px;
  font:8px var(--mono);
  letter-spacing:.08em;
  color:var(--accent);
}
.system{
  margin:22px 0;
  text-align:center;
  color:#9297a2;
  font:7px var(--mono);
  letter-spacing:.1em;
  opacity:0;
  animation:fade .4s ease forwards;
}
.typing{
  display:flex;
  gap:4px;
  align-items:center;
  width:44px;
  height:28px;
}
.typing i{
  display:block;
  width:4px;height:4px;border-radius:50%;
  background:var(--muted);
  animation:dot 1s infinite ease-in-out;
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.bottom{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-top:1px solid var(--line);
  color:#9da1aa;
  font:8px var(--mono);
  letter-spacing:.08em;
}
.cursor{animation:blink 1s step-end infinite}
@keyframes pop{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes dot{
  0%,60%,100%{opacity:.22;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-3px)}
}
@keyframes blink{50%{opacity:0}}

@media(max-width:600px){
  body{padding:10px}
  .chat{height:78vh;padding:18px 12px 24px}
  .meta{width:67px;flex-basis:67px;font-size:6px}
  .bubble{max-width:76%;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span>RECOVERED CHAT / THREAD 04</span>
    <span class="status">● ACTIVE LOG</span>
  </div>

  <div class="chat" id="chat">
    <div class="day">日付不明　23:41</div>
  </div>

  <div class="bottom">
    <span>message field / read only</span>
    <span>restoring log<span class="cursor">_</span></span>
  </div>
</div>

<script>
const messages = [
  {type:"msg", who:"足立サホ", time:"23:41", side:"", text:"……二人とも、まだ起きてる？"},
  {type:"msg", who:"常世チヨ", time:"23:41", side:"", text:"起きてるよ。どうしたの、サホちゃん。"},
  {type:"msg", who:"月代キリ", time:"23:42", side:"self", text:"わたしもいるよ。なに？"},
  {type:"msg", who:"足立サホ", time:"23:42", side:"", text:"明日のプリント、どこにしまったか忘れちゃって。今日、机の上に置いてたかな。"},
  {type:"msg", who:"月代キリ", time:"23:42", side:"self", text:"置いてた。帰るとき、ノートにはさんでなかった？"},
  {type:"msg", who:"足立サホ", time:"23:43", side:"", text:"あっ、そうかも。ちょっと探してくるね。"},
  {type:"msg", who:"常世チヨ", time:"23:43", side:"", text:"慌てなくていいよ。"},
  {type:"msg", who:"足立サホ", time:"23:44", side:"", text:"……あった。ごめんね、こんな時間に。"},
  {type:"msg", who:"月代キリ", time:"23:44", side:"self", text:"だから、そんなに謝らなくていいって。"},
  {type:"msg", who:"足立サホ", time:"23:44", side:"", text:"ふふ。キリちゃん、いつもそう言うよね。"},
  {type:"msg", who:"月代キリ", time:"23:45", side:"self", text:"サホがいつも謝るからでしょ。"},
  {type:"msg", who:"常世チヨ", time:"23:45", side:"", text:"まあまあ。見つかってよかったね。"},
  {type:"msg", who:"足立サホ", time:"23:46", side:"", text:"うん。チヨちゃんもありがとう。"},
  {type:"system", text:"一部のメッセージを復元しました"},
  {type:"msg", who:"常世チヨ", time:"23:46", side:"", text:"そういえば、明日は一緒に帰れる？"},
  {type:"msg", who:"足立サホ", time:"23:47", side:"", text:"わたし、掃除当番があるから少し遅くなるかも。"},
  {type:"msg", who:"月代キリ", time:"23:47", side:"self", text:"じゃあ終わるまで待ってる。"},
  {type:"msg", who:"足立サホ", time:"23:47", side:"", text:"え、いいの？　先に帰ってても大丈夫だよ。"},
  {type:"msg", who:"月代キリ", time:"23:48", side:"self", text:"わたしが待ちたいんだから、別にいいじゃん。"},
  {type:"msg", who:"常世チヨ", time:"23:48", side:"", text:"じゃあ、わたしも待つね。"},
  {type:"msg", who:"足立サホ", time:"23:49", side:"", text:"二人とも、無理しなくていいのに。"},
  {type:"msg", who:"月代キリ", time:"23:49", side:"self", text:"それ、今日何回目？"},
  {type:"msg", who:"足立サホ", time:"23:49", side:"", text:"……何が？"},
  {type:"msg", who:"月代キリ", time:"23:50", side:"self", text:"「いいのに」ってやつ。サホ、嫌なことがあってもそう言いそう。"},
  {type:"msg", who:"足立サホ", time:"23:50", side:"", text:"そんなことないと思うけど……。"},
  {type:"msg", who:"月代キリ", time:"23:50", side:"self", text:"ほら、また曖昧。嫌なら嫌って言えばいいのに。"},
  {type:"msg", who:"常世チヨ", time:"23:51", side:"", text:"キリちゃん、もうそのへんにしよう？"},
  {type:"msg", who:"月代キリ", time:"23:51", side:"self", text:"……うん。言いすぎた。ごめん。"},
  {type:"msg", who:"足立サホ", time:"23:51", side:"", text:"大丈夫だよ。気にしてないから。"},
  {type:"msg", who:"月代キリ", time:"23:52", side:"self", text:"そういうとこも、サホらしいけどね。"},
  {type:"msg", who:"常世チヨ", time:"23:52", side:"", text:"二人とも、明日眠くなっちゃうよ。そろそろ寝ない？"},
  {type:"msg", who:"月代キリ", time:"23:52", side:"self", text:"チヨまで先生みたいなこと言う。"},
  {type:"msg", who:"足立サホ", time:"23:53", side:"", text:"じゃあ、明日起きられなかったらキリちゃんのせいにしようかな。"},
  {type:"msg", who:"月代キリ", time:"23:53", side:"self", text:"えっ、なんでわたし！？"},
  {type:"msg", who:"常世チヨ", time:"23:53", side:"", text:"ふふ。おやすみの前に仲直りできてよかったね。"},
  {type:"msg", who:"月代キリ", time:"23:54", side:"self", text:"別にけんかしてないってば。"},
  {type:"system", text:"23:54　通信が一時的に切断されました"},
  {type:"msg", who:"足立サホ", time:"23:55", side:"", text:"……戻った？"},
  {type:"msg", who:"常世チヨ", time:"23:55", side:"", text:"うん、戻ったみたい。"},
  {type:"msg", who:"月代キリ", time:"23:55", side:"self", text:"なんだ、切れたのか。"},
  {type:"msg", who:"足立サホ", time:"23:55", side:"", text:"じゃあ、今度こそおやすみ。"},
  {type:"msg", who:"常世チヨ", time:"23:55", side:"", text:"おやすみなさい。"},
  {type:"msg", who:"月代キリ", time:"23:55", side:"self", text:"おやすみ。また明日ね。"}
];

const chat = document.getElementById("chat");

function addMessage(item){
  if(item.type==="system"){
    const el=document.createElement("div");
    el.className="system";
    el.textContent=item.text;
    chat.appendChild(el);
    return;
  }
  const row=document.createElement("div");
  row.className="msg "+(item.side||"");
  row.innerHTML=`
    <div class="meta">${item.time}</div>
    <div class="bubble">
      <span class="name">${item.who}</span>
      ${item.text}
    </div>`;
  chat.appendChild(row);
}

function addTyping(){
  const row=document.createElement("div");
  row.className="msg self";
  row.id="typing";
  row.innerHTML=`
    <div class="meta">23:56</div>
    <div class="bubble typing">
      <i></i><i></i><i></i>
    </div>`;
  chat.appendChild(row);
}

let i=0;
function next(){
  if(i < messages.length){
    addMessage(messages[i]);
    i++;
    chat.scrollTop=chat.scrollHeight;
    setTimeout(next, i===1 ? 700 : 1050);
  }else{
    addTyping();
    chat.scrollTop=chat.scrollHeight;
  }
}
setTimeout(next,700);
</script>
</body>
</html>
